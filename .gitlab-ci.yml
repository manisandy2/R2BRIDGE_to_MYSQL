image: python:3.11

variables:
  CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
  CF_API_TOKEN: ${CF_API_TOKEN}
  PROJECT_NAME: "my-fastapi-app"

stages:
  - deploy

deploy-to-cloudflare:
  stage: deploy
  script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - pip install wrangler  # Wrangler CLI for deployment
    - wrangler pages publish . --project-name=$PROJECT_NAME --branch=main
  only:
    - master
